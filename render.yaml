services:
  - type: web
    name: jay-marques
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT run:app
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.10"
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false
